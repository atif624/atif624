<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
	<title id="title">Atif Aziz, applied AI engineer</title>
	<desc id="desc">A git log of the career so far: software engineer, then ML and data science, now applied AI engineer.</desc>
	<defs>
		<linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#38bdf8"/>
			<stop offset="0.55" stop-color="#60a5fa"/>
			<stop offset="1" stop-color="#818cf8"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.22" cy="0.4" r="0.55">
			<stop offset="0" stop-color="#0ea5e9" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.2" fill="#1e293b"/>
		</pattern>
		<clipPath id="card">
			<rect width="1200" height="400" rx="20"/>
		</clipPath>
		<style>
			.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
			.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
			.cursor { animation: blink 1.1s steps(1) infinite; }
			.commit { opacity: 0; animation: rise 0.6s ease-out forwards; }
			.c1 { animation-delay: 0.3s; }
			.c2 { animation-delay: 0.9s; }
			.c3 { animation-delay: 1.5s; }
			@keyframes blink { 50% { opacity: 0; } }
			@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
			@media (prefers-reduced-motion: reduce) {
				.cursor, .commit { animation: none; opacity: 1; }
			}
		</style>
	</defs>

	<g clip-path="url(#card)">
		<rect width="1200" height="400" fill="#020817"/>
		<rect width="1200" height="400" fill="url(#dots)"/>
		<rect width="1200" height="400" fill="url(#glow)"/>

		<!-- Who -->
		<rect x="64" y="66" width="322" height="38" rx="19" fill="#0b1a33" stroke="#38bdf8" stroke-opacity="0.35"/>
		<circle cx="88" cy="85" r="5" fill="#38bdf8"/>
		<text class="mono" x="104" y="91" font-size="16" fill="#93c5fd" textLength="264" lengthAdjust="spacing">Based in Islamabad, Pakistan</text>

		<text class="sans" x="60" y="200" font-size="88" font-weight="700" letter-spacing="-2" fill="url(#name)">Atif Aziz</text>
		<text class="mono" x="66" y="252" font-size="24" fill="#60a5fa">// applied AI engineer<tspan class="cursor" fill="#38bdf8">▍</tspan></text>

		<text class="sans" x="66" y="306" font-size="21" fill="#cbd5e1">Software engineer, raised on ML &amp; data science.</text>
		<text class="sans" x="66" y="338" font-size="21" fill="#cbd5e1">Building applied AI these days. Still in love with data.</text>

		<text class="mono" x="66" y="378" font-size="14" fill="#334155">[INFO] still_loves_data = TRUE</text>

		<!-- The career so far, as a git log -->
		<rect x="716" y="66" width="420" height="276" rx="14" fill="#0b1220" fill-opacity="0.85" stroke="#1e293b"/>
		<text class="mono" x="744" y="104" font-size="16" fill="#64748b">$ git log --graph atif</text>
		<line x1="756" y1="150" x2="756" y2="290" stroke="#334155" stroke-width="2"/>

		<g class="commit c3">
			<circle cx="756" cy="150" r="12" fill="#38bdf8" fill-opacity="0.18"/>
			<circle cx="756" cy="150" r="7" fill="#38bdf8"/>
			<text class="mono" x="782" y="146" font-size="15" fill="#475569">a1f7c0d <tspan fill="#38bdf8">(HEAD → now)</tspan></text>
			<text class="mono" x="782" y="171" font-size="19" fill="#e2e8f0">feat: applied AI engineer</text>
		</g>
		<g class="commit c2">
			<circle cx="756" cy="220" r="7" fill="#020817" stroke="#64748b" stroke-width="2"/>
			<text class="mono" x="782" y="216" font-size="15" fill="#475569">5d2e9b4</text>
			<text class="mono" x="782" y="241" font-size="19" fill="#94a3b8">feat: ML &amp; data science</text>
		</g>
		<g class="commit c1">
			<circle cx="756" cy="290" r="7" fill="#020817" stroke="#64748b" stroke-width="2"/>
			<text class="mono" x="782" y="286" font-size="15" fill="#475569">0c3a1e7 <tspan fill="#64748b">(initial commit)</tspan></text>
			<text class="mono" x="782" y="311" font-size="19" fill="#94a3b8">init: software engineer</text>
		</g>
	</g>

	<rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#1e293b"/>
</svg>
